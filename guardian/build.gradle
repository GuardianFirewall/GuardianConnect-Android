plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.guardianconnect'
    compileSdk 36

    buildFeatures {
        buildConfig = true
        dataBinding = true
    }

    publishing {
        singleVariant("release") {
            withJavadocJar()
            withSourcesJar()
        }
    }

    defaultConfig {
        minSdkVersion 24
        targetSdkVersion 36
        buildConfigField 'int', 'MIN_SDK_VERSION', "$minSdkVersion.apiLevel"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled = true
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"

    implementation "com.wireguard.android:tunnel:1.0.20260102"
    implementation "com.google.code.gson:gson:2.14.0"
    implementation "com.squareup.okhttp3:okhttp:5.4.0"
    implementation "com.squareup.okhttp3:logging-interceptor:5.4.0"
    implementation "com.squareup.retrofit2:retrofit:3.0.0"
    implementation "com.squareup.retrofit2:converter-gson:3.0.0"
    implementation 'com.squareup.okhttp3:okhttp-dnsoverhttps:4.9.1'
    implementation 'com.android.billingclient:billing:7.0.0'
    implementation "com.android.billingclient:billing-ktx:7.0.0"

    implementation "androidx.datastore:datastore-preferences:$datastoreVersion"
    implementation "com.journeyapps:zxing-android-embedded:$zxingEmbeddedVersion"
    implementation "androidx.preference:preference-ktx:$preferenceKtxVersion"

    implementation 'androidx.test.ext:junit-ktx:1.3.0'
    androidTestImplementation 'junit:junit:4.13.2'
    androidTestImplementation "androidx.test:runner:1.7.0"
    testImplementation 'org.mockito:mockito-core:5.23.0'
    androidTestImplementation 'org.mockito:mockito-android:5.23.0'
}

ext {
    PUBLISH_GROUP_ID = 'com.guardianapp.connect'
    PUBLISH_VERSION = '0.7.4'
    PUBLISH_ARTIFACT_ID = 'GuardianConnect'
}
apply from: 'publish-remote.gradle'
